name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java, VICE (c1541) and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless vice python3-pil

      - name: Get KickAssembler
        run: |
          curl -sfL -o kickass.zip https://theweb.dk/KickAssembler/KickAssembler.zip
          unzip -q -j kickass.zip KickAss.jar -d tools

      - name: Build PRGs and D64
        run: tools/build.sh

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: worldcities-d64
          path: build/worldcities.d64
